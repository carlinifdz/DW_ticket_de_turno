<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar turno | Ticket de Turno</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='editar.css') }}">
</head>

<body>
    <main class="contenedor">

        <nav class="navegacion-formulario">
            <a href="{{ url_for('publico.inicio') }}">
                ← Volver al inicio
            </a>
        </nav>

        <header class="encabezado">
            <h1>Consultar o editar turno</h1>
        </header>

        <!-- Paso 1: localizar la solicitud -->
        <form id="formularioConsulta">
            <div class="formulario">

                <div class="campo">
                    <label for="curpConsulta">CURP:</label>
                    <input type="text" id="curpConsulta" name="curp" maxlength="18">
                </div>

                <div class="campo">
                    <label for="municipio">Municipio:</label>
                    <select id="municipio" name="municipio">
                        <option value="">Cargando municipios...</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="numeroTurno">Número de turno:</label>
                    <input type="number" id="numeroTurno" name="numero_turno" min="1">
                </div>

            </div>

            <div class="acciones">
                <button type="submit">Consultar</button>
            </div>
        </form>

        <p id="mensajeConsulta" class="mensaje" role="alert"></p>

        <!-- Paso 2: editar los datos (oculto hasta consultar) -->
        <form id="formularioEdicion" hidden>

            <div class="resumen-turno">
                <span>Folio <strong id="resumenFolio"></strong></span>
                <span>Turno <strong id="resumenTurno"></strong></span>
                <span id="resumenMunicipio"></span>
            </div>

            <div class="formulario">

                <div class="campo campo-grande">
                    <label for="responsable">
                        Nombre completo de quien realizará el trámite:
                    </label>
                    <input type="text" id="responsable" name="responsable">
                </div>

                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="campo">
                    <label for="paterno">Paterno:</label>
                    <input type="text" id="paterno" name="paterno">
                </div>

                <div class="campo">
                    <label for="materno">Materno:</label>
                    <input type="text" id="materno" name="materno">
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" maxlength="10">
                </div>

                <div class="campo">
                    <label for="celular">Celular:</label>
                    <input type="tel" id="celular" name="celular" maxlength="10">
                </div>

                <div class="campo campo-grande">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo">
                </div>

            </div>

            <div class="acciones">
                <button type="submit">Guardar cambios</button>
            </div>

            <p id="mensajeEdicion" class="mensaje" role="alert"></p>

        </form>

    </main>

    <script src="{{ url_for('static', filename='api.js') }}"></script>
    <script src="{{ url_for('static', filename='editar.js') }}"></script>
</body>

</html>
